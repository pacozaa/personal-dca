[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dca-stock"
version = "0.1.0"
description = "Stock DCA (Dollar Cost Averaging) calculations and logic"
requires-python = "==3.13.5"
license = "MIT"
readme = "README.md"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.scripts]
dca-stock-analyze = "dca_stock.analyze:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.hatch.envs.default]
python = "3.13.5"

[tool.hatch.build.targets.wheel]
packages = ["dca_stock"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
